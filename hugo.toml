baseURL = "https://devendra-dagur.github.io/"
locale = "en-US"
title = "CISSP Learning"
theme = "PaperMod"
enableRobotsTXT = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowToc = true
  ShowPostNavLinks = true

[params.homeInfoParams]
  Title = "Security & Architecture Notes"
  Content = "Personal study notes, CISSP domain summaries, and Application Security architecture references by Devendra Dagur."

[params.fuseOpts]
  isCaseSensitive = false
  shouldSort = true
  ignoreLocation = true
  threshold = 0.4
  minMatchCharLength = 2
  keys = ["title", "permalink", "summary", "content"]

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Devendra-Dagur"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://www.linkedin.com/in/YOUR-HANDLE/"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "archives"
  name = "Archives"
  url = "/archives/"
  weight = 30